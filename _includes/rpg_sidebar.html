<script>
// Sidebar functionality
function initRpgSidebar() {
    const navToggle = document.getElementById('nav-toggle');
    const navSidebar = document.getElementById('rpg-nav-sidebar');
    
    if (navToggle && navSidebar) {
        // Toggle sidebar
        navToggle.addEventListener('click', function(e) {
            e.stopPropagation();
            navSidebar.classList.toggle('open');
        });
        
        // Close sidebar when clicking outside
        document.addEventListener('click', function(e) {
            if (!navSidebar.contains(e.target) && !navToggle.contains(e.target)) {
                navSidebar.classList.remove('open');
            }
        });
        
        // Mark current page
        const currentPath = window.location.pathname;
        document.querySelectorAll('.nav-link').forEach(link => {
            if (link.getAttribute('href') === currentPath) {
                link.classList.add('active');
                link.classList.add('visited');
                const check = link.querySelector('.nav-check');
                if (check) check.style.display = 'inline';
            }
        });
    }
}

// Initialize on page load
if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initRpgSidebar);
} else {
    initRpgSidebar();
}
</script>
